<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Issue Reporting System</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f4f9; margin:0; padding:0; }
  header { background: #4CAF50; color: white; padding: 15px; text-align: center; }
  main { max-width: 700px; margin: 30px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
  h2 { text-align: center; color: #333; }
  form { display: flex; flex-direction: column; }
  label { margin: 10px 0 5px; }
  select, textarea, button, input[type="file"], input[type="date"] { padding: 10px; border-radius: 5px; border: 1px solid #ccc; margin-bottom: 10px; }
  button { background: #4CAF50; color: white; border: none; cursor: pointer; font-size: 16px; }
  button:hover { background: #45a049; }
  .hidden { display: none; }
  .nav { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
  .nav button { padding: 10px 20px; border-radius: 5px; border: 1px solid #ccc; background: white; color: #333; cursor: pointer; }
  .nav button.active { background: #4CAF50; color: white; border-color: #4CAF50; }
  .submitted { background: #e2f7e2; padding: 15px; border-radius: 8px; text-align: center; }
  .unsolved { border: 1px solid red; padding: 10px; margin-bottom: 10px; border-radius: 5px; background: #fdd; }
  .problem { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 5px; background: #fff0f0; }
  .solved { border: 1px solid #4CAF50; padding: 10px; margin-bottom: 10px; border-radius: 5px; background: #e2f7e2; }
  img { max-width: 200px; display: block; margin-top: 10px; border-radius: 8px; }
</style>
</head>
<body>

<header>
  <h1>Classroom Issue Reporting System</h1>
</header>

<div class="nav">
  <button id="tabReport" class="active">Report Problem</button>
  <button id="tabSubmitted">Submitted</button>
  <button id="tabIT">IT Dashboard</button>
  <button id="tabSolved">Solved Problems</button>
  <button id="tabUnsolved">Unsolved Problems</button>
</div>

<main>
  <!-- Report Form -->
  <section id="reportSection">
    <h2>Report a Problem</h2>
    <form id="reportForm">
      <label for="building">Select Building:</label>
      <select id="building" required>
        <option value="">--Select--</option>
        <option value="Block A">Block A</option>
        <option value="Block B">Block B</option>
        <option value="Block C">Block C</option>
      </select>

      <label for="floor">Select Floor:</label>
      <select id="floor" required>
        <option value="">--Select Floor--</option>
      </select>

      <label for="classroom">Select Classroom:</label>
      <select id="classroom" required>
        <option value="">--Select Room--</option>
      </select>

      <label for="category">Problem Type:</label>
      <select id="category" required>
        <option value="">--Select--</option>
        <option value="Projector">Projector</option>
        <option value="PC">PC</option>
        <option value="AC">AC</option>
        <option value="Light">Light</option>
        <option value="Furniture">Furniture</option>
        <option value="Other">Other</option>
      </select>

      <label for="description">Description:</label>
      <textarea id="description" rows="4" placeholder="Describe the problem..." required></textarea>

      <label for="image">Upload Image (optional):</label>
      <input type="file" id="image" accept="image/*">

      <button type="submit">Submit Report</button>
    </form>
  </section>

  <!-- Submitted Section -->
  <section id="submittedSection" class="hidden">
    <div class="submitted" id="submittedDiv"></div>
  </section>

  <!-- IT Dashboard Section -->
  <section id="itSection" class="hidden">
    <h2>IT Dashboard - Pending Problems</h2>
    <div id="itDiv"></div>
  </section>

  <!-- Solved Problems Section -->
  <section id="solvedSection" class="hidden">
    <h2>Solved Problems</h2>
    <div id="solvedDiv"></div>
  </section>

  <!-- Unsolved Problems Section -->
  <section id="unsolvedSection" class="hidden">
    <h2>Unsolved Problems</h2>
    <div id="unsolvedDiv"></div>
  </section>
</main>

<script>
  const tabReport = document.getElementById('tabReport');
  const tabSubmitted = document.getElementById('tabSubmitted');
  const tabIT = document.getElementById('tabIT');
  const tabSolved = document.getElementById('tabSolved');
  const tabUnsolved = document.getElementById('tabUnsolved');

  const reportSection = document.getElementById('reportSection');
  const submittedSection = document.getElementById('submittedSection');
  const itSection = document.getElementById('itSection');
  const solvedSection = document.getElementById('solvedSection');
  const unsolvedSection = document.getElementById('unsolvedSection');

  function showSection(section) {
    reportSection.classList.add('hidden');
    submittedSection.classList.add('hidden');
    itSection.classList.add('hidden');
    solvedSection.classList.add('hidden');
    unsolvedSection.classList.add('hidden');

    tabReport.classList.remove('active');
    tabSubmitted.classList.remove('active');
    tabIT.classList.remove('active');
    tabSolved.classList.remove('active');
    tabUnsolved.classList.remove('active');

    section.classList.remove('hidden');

    if(section === reportSection) tabReport.classList.add('active');
    if(section === submittedSection) tabSubmitted.classList.add('active');
    if(section === itSection) tabIT.classList.add('active');
    if(section === solvedSection) tabSolved.classList.add('active');
    if(section === unsolvedSection) tabUnsolved.classList.add('active');
  }

  tabReport.onclick = () => showSection(reportSection);
  tabSubmitted.onclick = () => showSection(submittedSection);
  tabIT.onclick = () => { showSection(itSection); loadIT(); };
  tabSolved.onclick = () => { showSection(solvedSection); loadSolved(); };
  tabUnsolved.onclick = () => { showSection(unsolvedSection); loadUnsolved(); };

  const reportForm = document.getElementById('reportForm');
  const submittedDiv = document.getElementById('submittedDiv');
  const itDiv = document.getElementById('itDiv');
  const solvedDiv = document.getElementById('solvedDiv');
  const unsolvedDiv = document.getElementById('unsolvedDiv');

  let problems = JSON.parse(localStorage.getItem('problems')) || [];
  let solvedProblems = JSON.parse(localStorage.getItem('solvedProblems')) || [];

  const floorSelect = document.getElementById('floor');
  const classroomSelect = document.getElementById('classroom');
  const buildingSelect = document.getElementById('building');

  // ✅ Floors
  for(let f=1; f<=5; f++){
    const option = document.createElement('option');
    option.value = f;
    option.textContent = Floor ${f};
    floorSelect.appendChild(option);
  }

  // ✅ Update classrooms when floor or block changes
  floorSelect.addEventListener('change', updateRooms);
  buildingSelect.addEventListener('change', updateRooms);

  function updateRooms() {
    classroomSelect.innerHTML = '<option value="">--Select Room--</option>';
    const floor = parseInt(floorSelect.value);
    const block = buildingSelect.value;
    if(!block || !floor) return;

    let prefix = '';
    if(block === 'Block A') prefix = 'A';
    else if(block === 'Block B') prefix = 'B';
    else if(block === 'Block C') prefix = 'C';

    for(let r=1; r<=10; r++){
      const roomNumber = ${prefix}${floor}00${r};
      const option = document.createElement('option');
      option.value = roomNumber;
      option.textContent = roomNumber;
      classroomSelect.appendChild(option);
    }
  }

  reportForm.addEventListener('submit', function(e){
    e.preventDefault();

    const fileInput = document.getElementById('image');
    const file = fileInput.files[0];

    if (file) {
      const reader = new FileReader();
      reader.onload = function() {
        saveProblem(reader.result);
      };
      reader.readAsDataURL(file);
    } else {
      saveProblem('');
    }
  });

  function saveProblem(imageURL) {
    const problem = {
      building: document.getElementById('building').value,
      floor: floorSelect.value,
      classroom: classroomSelect.value,
      category: document.getElementById('category').value,
      description: document.getElementById('description').value,
      date: new Date().toLocaleString(),
      image: imageURL,
      expectedDate: ''
    };
    problems.push(problem);
    localStorage.setItem('problems', JSON.stringify(problems));

    submittedDiv.innerHTML = `<h3>Report Submitted Successfully!</h3>
      <p><strong>Building:</strong> ${problem.building}</p>
      <p><strong>Floor:</strong> ${problem.floor}</p>
      <p><strong>Classroom:</strong> ${problem.classroom}</p>
      <p><strong>Category:</strong> ${problem.category}</p>
      <p><strong>Description:</strong> ${problem.description}</p>
      ${problem.image ? <img src="${problem.image}" alt="Issue Image"> : ""}
      <p><em>Submitted on ${problem.date}</em></p>`;
    showSection(submittedSection);
    reportForm.reset();
  }

  function loadIT(){
    itDiv.innerHTML = '';
    if(problems.length === 0){
      itDiv.innerHTML = '<p>No pending problems.</p>';
      return;
    }
    problems.forEach((p,index)=>{
      const div = document.createElement('div');
      div.className = 'problem';
      div.innerHTML = `
        <strong>Building:</strong> ${p.building}, <strong>Floor:</strong> ${p.floor}, <strong>Classroom:</strong> ${p.classroom}<br>
        <strong>Category:</strong> ${p.category}<br>
        <strong>Description:</strong> ${p.description}<br>
        ${p.image ? <img src="${p.image}" alt="Issue Image"> : ""}
        <em>Reported on: ${p.date}</em><br>
        <label>Expected Solve Date:</label>
        <input type="date" id="date${index}" value="${p.expectedDate || ''}">
        <button onclick="saveExpectedDate(${index})">Save Date</button>
        <button onclick="markSolved(${index})">Mark as Solved</button>
      `;
      itDiv.appendChild(div);
    });
  }

  function saveExpectedDate(index){
    const dateInput = document.getElementById(date${index});
    problems[index].expectedDate = dateInput.value;
    localStorage.setItem('problems', JSON.stringify(problems));
    alert('Expected solve date saved.');
    loadIT();
  }

  function loadUnsolved(){
    unsolvedDiv.innerHTML = '';
    if(problems.length === 0){
      unsolvedDiv.innerHTML = '<p>No unsolved problems yet.</p>';
      return;
    }
    problems.forEach((p)=>{
      const div = document.createElement('div');
      div.className = 'unsolved';
      div.innerHTML = `
        <strong>Building:</strong> ${p.building}, <strong>Floor:</strong> ${p.floor}, <strong>Classroom:</strong> ${p.classroom}<br>
        <strong>Category:</strong> ${p.category}<br>
        <strong>Description:</strong> ${p.description}<br>
        ${p.image ? <img src="${p.image}" alt="Issue Image"> : ""}
        <em>Reported on: ${p.date}</em><br>
        ${p.expectedDate ? <strong>Expected Solve Date:</strong> ${p.expectedDate}<br> : ""}
      `;
      unsolvedDiv.appendChild(div);
    });
  }

  function loadSolved(){
    solvedDiv.innerHTML = '';
    if(solvedProblems.length === 0){
      solvedDiv.innerHTML = '<p>No solved problems yet.</p>';
      return;
    }
    solvedProblems.forEach(p=>{
      const div = document.createElement('div');
      div.className = 'solved';
      div.innerHTML = `<strong>Building:</strong> ${p.building}, <strong>Floor:</strong> ${p.floor}, <strong>Classroom:</strong> ${p.classroom}<br>
        <strong>Category:</strong> ${p.category}<br>
        <strong>Description:</strong> ${p.description}<br>
        ${p.image ? <img src="${p.image}" alt="Issue Image"> : ""}
        <em>Reported on: ${p.date}</em><br>
        <em>Solved on: ${p.solvedDate}</em>`;
      solvedDiv.appendChild(div);
    });
  }

  function markSolved(index){
    const solved = problems.splice(index,1)[0];
    solved.solvedDate = new Date().toLocaleString();
    solvedProblems.push(solved);
    localStorage.setItem('problems', JSON.stringify(problems));
    localStorage.setItem('solvedProblems', JSON.stringify(solvedProblems));
    loadIT();
    loadUnsolved();
    loadSolved();
  }

  setInterval(()=>{
    if(!itSection.classList.contains('hidden')) loadIT();
    if(!solvedSection.classList.contains('hidden')) loadSolved();
    if(!unsolvedSection.classList.contains('hidden')) loadUnsolved();
  },5000);
</script>
</body>
</html>
