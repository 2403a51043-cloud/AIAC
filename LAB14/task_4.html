<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fetch & Render Example</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#f3f6fb;display:flex;justify-content:center;padding:40px}
  #app{width:350px}
  h2{text-align:center;color:#2c3e50;margin-bottom:20px}
  .card{background:#fff;padding:15px;margin:10px 0;border-radius:12px;
        box-shadow:0 4px 10px rgba(0,0,0,.1);transition:transform .2s}
  .card:hover{transform:translateY(-3px)}
  .skeleton{height:20px;background:linear-gradient(90deg,#eee,#ddd,#eee);
            background-size:200% 100%;animation:shimmer 1.5s infinite;
            border-radius:6px;margin-bottom:10px}
  @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
  .error{text-align:center;color:#e74c3c;font-weight:bold;margin-top:20px}
  button{display:block;margin:15px auto;padding:8px 16px;border:none;
         background:#3498db;color:#fff;border-radius:8px;cursor:pointer}
  button:hover{background:#2980b9}
</style>
</head>
<body>
<div id="app"><h2>Users</h2><div id="list"></div></div>

<script>
const list=document.getElementById("list");

function showSkeleton(n=5){
  list.innerHTML="";
  for(let i=0;i<n;i++){
    let d=document.createElement("div");
    d.className="card skeleton";
    list.appendChild(d);
  }
}

async function fetchData(){
  showSkeleton();
  try{
    const res=await fetch("https://jsonplaceholder.typicode.com/users");
    if(!res.ok)throw new Error("Failed to fetch data");
    const data=await res.json();
    list.innerHTML="";
    data.forEach(u=>{
      const card=document.createElement("div");
      card.className="card";
      card.innerHTML=`<strong>${u.name}</strong><br><small>${u.email}</small>`;
      list.appendChild(card);
    });
  }catch(err){
    list.innerHTML=`<p class="error">⚠️ ${err.message}</p>`;
    const btn=document.createElement("button");
    btn.textContent="Retry";
    btn.onclick=fetchData;
    list.appendChild(btn);
  }
}
fetchData();
</script>
</body>
</html>
