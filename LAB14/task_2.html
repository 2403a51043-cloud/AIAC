<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Product — Online Store</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--accent:#0066ff;--accent-variant:#0049b8;--muted:#6b7280;--radius:12px;--shadow:0 6px 20px rgba(2,6,23,0.08)}
html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:#0f172a;-webkit-font-smoothing:antialiased}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;box-sizing:border-box}
.product-card{width:100%;max-width:980px;display:grid;grid-template-columns:1fr;gap:28px;background:var(--card);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s;overflow:hidden;align-items:center}
@media(min-width:760px){.product-card{grid-template-columns:420px 1fr;padding:28px}}
@media(hover:hover){.product-card:hover{transform:translateY(-6px);box-shadow:0 14px 40px rgba(2,6,23,0.12)}}
.product-card__media{background:linear-gradient(135deg,rgba(0,102,255,0.06),rgba(0,102,255,0.02));border-radius:10px;display:flex;align-items:center;justify-content:center;padding:22px;min-height:260px;position:relative;overflow:hidden;transition:transform .22s}
.product-card__media-inner{width:100%;max-width:360px;transform:translateZ(0);transition:transform .32s cubic-bezier(.2,.9,.3,1)}
@media(hover:hover){.product-card__media:hover .product-card__media-inner{transform:scale(1.04) rotate(-1deg)}}
.product-card__title{margin:0 0 8px;font-size:20px;line-height:1.15}
.product-card__subtitle{margin:0 0 18px;color:var(--muted);font-size:14px}
.product-card__price{margin:0 0 18px;font-size:22px;font-weight:700;color:#08123a}
@media(min-width:760px){.product-card__title{font-size:24px}.product-card__price{font-size:26px}}
.product-card__controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.product-card__button{background:var(--accent);color:#fff;border:0;padding:12px 16px;border-radius:10px;cursor:pointer;font-weight:600;font-size:15px;box-shadow:0 6px 18px rgba(2,6,23,0.08);transition:transform .12s,background .12s,box-shadow .12s}
.product-card__button:active{transform:translateY(1px) scale(.998)}
@media(hover:hover){.product-card__button:hover{background:var(--accent-variant);box-shadow:0 12px 30px rgba(0,70,180,0.12);transform:translateY(-2px)}}
.product-card__meta{display:flex;gap:14px;color:var(--muted);font-size:13px;align-items:center}
.product-card__badge{background:rgba(0,102,255,0.06);color:var(--accent);padding:6px 10px;border-radius:8px;font-weight:600;font-size:13px}
.toast{position:fixed;right:20px;top:20px;background:linear-gradient(90deg,rgba(0,102,255,1),rgba(0,85,210,1));color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 8px 30px rgba(2,6,23,0.12);transform:translateY(-8px) scale(.98);opacity:0;pointer-events:none;transition:opacity .18s,transform .2s;font-weight:600}
.toast--visible{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.muted{color:var(--muted)}
</style>
</head>
<body>
<main class="page" id="page">
<article class="product-card" aria-label="Product card">
<figure class="product-card__media" aria-hidden="false">
<div class="product-card__media-inner" role="img" aria-label="Sample product image">
<svg width="100%" height="100%" viewBox="0 0 500 500" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#6ea8ff"/><stop offset="1" stop-color="#2c6ef0"/></linearGradient></defs>
<rect x="20" y="60" rx="28" width="460" height="360" fill="url(#g)" opacity="0.12"/><rect x="80" y="120" rx="20" width="340" height="240" fill="#fff" stroke="rgba(4,8,23,0.06)"/><g transform="translate(120,150)" fill="#2c6ef0" opacity="0.95"><path d="M160 0c44 0 80 36 80 80s-36 80-80 80-80-36-80-80 36-80 80-80z"/></g>
<text x="50%" y="88%" text-anchor="middle" fill="#6b7280" font-family="Inter, Arial" font-size="18">Product Image</text>
</svg>
</div>
</figure>
<div class="product-card__content">
<h1 class="product-card__title">Aurora Wireless Headphones</h1>
<p class="product-card__subtitle">Premium sound, 30h battery, and active noise cancellation for immersive listening.</p>
<p class="product-card__price" aria-live="polite">$129.00</p>
<div class="product-card__controls" role="group" aria-label="Purchase controls">
<button class="product-card__button" id="addToCartBtn" aria-pressed="false">Add to Cart</button>
<div class="product-card__meta"><span class="product-card__badge">Free Shipping</span><span class="muted">In stock</span></div>
</div>
</div>
</article>
<div id="toast" class="toast" role="status" aria-live="assertive" aria-atomic="true">Added to cart</div>
</main>
<script>
(() => {
const btn = document.getElementById('addToCartBtn'), toast = document.getElementById('toast');
let cartCount = 0, hideTimer;
const showToast = msg => {
    toast.textContent = msg;
    toast.classList.add('toast--visible');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(()=> toast.classList.remove('toast--visible'), 2500);
};
btn.addEventListener('click', () => {
    cartCount++;
    btn.setAttribute('aria-pressed','true');
    btn.animate([{transform:'scale(1)'},{transform:'scale(.98)'},{transform:'scale(1)'}],{duration:160,easing:'cubic-bezier(.2,.9,.3,1)'});
    const msg = `Added "Aurora Wireless Headphones" — Cart: ${cartCount}`;
    if (toast) showToast(msg); else alert(msg);
});
btn.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') btn.click(); });
})();
</script>
</body>
</html>
